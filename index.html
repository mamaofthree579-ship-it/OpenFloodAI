<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🌊 OpenFloodAI — Global Flood Forecasts</title>

  <style>
    body {
      font-family: "Segoe UI", Arial, sans-serif;
      background: #eef6ff;
      color: #333;
      margin: 0;
      padding: 0;
    }

    header {
      background: #0077cc;
      color: white;
      padding: 15px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
    }

    header img {
      height: 40px;
      margin-right: 10px;
    }

    h1 {
      font-size: 1.6em;
      margin: 0;
    }

    main {
      padding: 20px;
    }

    select {
      padding: 8px;
      margin: 5px;
      font-size: 1em;
      border-radius: 4px;
      border: 1px solid #ccc;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 20px;
      background: white;
      border-radius: 6px;
      overflow: hidden;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }

    th, td {
      border-bottom: 1px solid #ddd;
      text-align: center;
      padding: 12px;
    }

    th {
      background-color: #0077cc;
      color: white;
    }

    tr:hover {
      background-color: #f3f8ff;
    }

    .RED { background-color: #ffb3b3; }
    .AMBER { background-color: #fff2b3; }
    .GREEN { background-color: #c6f6c3; }

    .bar-container {
      width: 100%;
      background-color: #e6e6e6;
      border-radius: 4px;
      overflow: hidden;
      height: 12px;
      margin-top: 4px;
    }

    .bar {
      height: 12px;
    }

    .bar.RED { background-color: #ff4d4d; }
    .bar.AMBER { background-color: #ffc107; }
    .bar.GREEN { background-color: #28a745; }

    footer {
      background: #0077cc;
      color: white;
      padding: 10px;
      text-align: center;
      margin-top: 40px;
    }

    /* Tabs */
    .tab-container {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      margin-top: 10px;
    }
    .tab {
      background: #e0ecff;
      border: 1px solid #0077cc;
      color: #0077cc;
      padding: 8px 12px;
      margin: 5px;
      border-radius: 4px;
      cursor: pointer;
    }
    .tab.active {
      background: #0077cc;
      color: white;
      font-weight: bold;
    }
  </style>
</head>

<body>
  <header>
    <div style="display:flex; align-items:center;">
      <img src="logo.svg" alt="Logo">
      <h1>🌊 OpenFloodAI — Global Dashboard</h1>
    </div>
    <div id="updateTime">Loading...</div>
  </header>

  <main>
    <div class="tab-container" id="continentTabs"></div>

    <table id="forecastTable" style="display:none;">
      <thead>
        <tr><th>Country / Region</th><th>Flood Probability</th><th>Risk Tier</th></tr>
      </thead>
      <tbody id="forecastBody"></tbody>
    </table>
  </main>

  <footer>🌍 OpenFloodAI — Open & Community Flood Forecasting</footer>

  <script>
    let forecastData = {};
    let continentMap = {
      "North America": ["United States", "Canada", "Mexico"],
      "South America": ["Brazil", "Argentina", "Chile", "Colombia"],
      "Europe": ["United Kingdom", "France", "Germany", "Italy", "Spain", "Norway", "Sweden", "Netherlands"],
      "Africa": ["Nigeria", "South Africa", "Kenya", "Egypt", "Ghana", "Ethiopia"],
      "Asia": ["China", "India", "Japan", "Indonesia", "Philippines", "Thailand"],
      "Oceania": ["Australia", "New Zealand"]
    };

    async function loadForecast() {
      try {
        const res = await fetch("data/outputs/all_forecasts.json?cb=" + Date.now());
        const data = await res.json();
        forecastData = data.forecasts;
        document.getElementById("updateTime").innerText = "Updated: " + new Date(data.timestamp).toLocaleString();

        // Normalize and include missing countries
        const countriesInData = Object.keys(forecastData);
        countriesInData.forEach(country => {
          let found = false;
          for (const [cont, list] of Object.entries(continentMap)) {
            if (list.includes(country)) found = true;
          }
          if (!found) {
            console.warn(`⚠️ '${country}' not mapped to any continent. Added to "Other".`);
            continentMap["Other"] = continentMap["Other"] || [];
            continentMap["Other"].push(country);
          }
        });

        // Sort alphabetically
        for (const cont in continentMap) {
          continentMap[cont].sort();
        }

        // Create continent tabs
        const tabContainer = document.getElementById("continentTabs");
        tabContainer.innerHTML = "";
        Object.keys(continentMap).forEach((cont, idx) => {
          const tab = document.createElement("div");
          tab.textContent = cont;
          tab.className = "tab" + (idx === 0 ? " active" : "");
          tab.onclick = () => showContinent(cont, tab);
          tabContainer.appendChild(tab);
        });

        showContinent(Object.keys(continentMap)[0]); // Default: first tab
      } catch (err) {
        document.getElementById("updateTime").innerText = "⚠️ Could not load forecast data.";
        console.error(err);
      }
    }

    function showContinent(continent, tabEl) {
      document.querySelectorAll(".tab").forEach(tab => tab.classList.remove("active"));
      if (tabEl) tabEl.classList.add("active");

      const tbody = document.getElementById("forecastBody");
      tbody.innerHTML = "";

      (continentMap[continent] || []).forEach(country => {
        const countryData = forecastData[country];
        if (!countryData) return;

        const avgProb = Object.values(countryData).reduce((sum, v) => sum + v.P_final, 0) / Object.keys(countryData).length;
        const tier = avgProb >= 0.66 ? "RED" : avgProb >= 0.33 ? "AMBER" : "GREEN";
        const probability = (avgProb * 100).toFixed(1);

        const row = document.createElement("tr");
        row.className = tier;
        row.innerHTML = `
          <td>${country}</td>
          <td>${probability}% 
            <div class="bar-container">
              <div class="bar ${tier}" style="width:${probability}%"></div>
            </div>
          </td>
          <td><strong>${tier}</strong></td>`;
        tbody.appendChild(row);
      });

      document.getElementById("forecastTable").style.display = "table";
    }

    loadForecast();
  </script>
</body>
</html>
