name: 🌊 Run Daily Flood Forecast

on:
  schedule:
    - cron: "0 6 * * *"   # Runs every day at 6 AM UTC
  workflow_dispatch:      # Allows manual trigger

jobs:
  run-forecast:
    runs-on: ubuntu-latest

    steps:
      - name: 🧭 Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🐍 Set Up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: 📦 Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: 🌊 Run Forecast Script
        run: |
          echo "Running OpenFloodAI forecast generator..."
          python scripts/flood_predictor_runner.py

      - name: 🗂 Commit and Push Results
        run: |
          echo "Preparing to commit forecast output..."
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add data/outputs/all_forecasts.json || true
          git status

          if git diff --cached --quiet; then
            echo "✅ No forecast changes detected (timestamp may have updated)."
            echo "Forcing a minor commit to refresh GitHub Pages."
            date > data/outputs/last_run.txt
            git add data/outputs/last_run.txt
          fi

          git commit -m "🤖 Automated daily forecast update — $(date -u +'%Y-%m-%d %H:%M UTC')" || echo "No changes to commit."
          git pull --rebase origin main || true
          git push origin main || echo "No push necessary — repo already up to date."

      - name: 🌐 Trigger GitHub Pages Build
        run: |
          echo "✅ Workflow completed — dashboard will refresh automatically."
